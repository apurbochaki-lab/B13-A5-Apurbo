<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>

    <!-- DaisyUI + TailWind -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Stylesheet -->
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <nav class="bg-base-100 shadow-sm">
        <div class="navbar flex justify-between items-center  container mx-auto">
            <div class="flex items-center gap-2">
                <img class="w-10" src="./assets/github-logo.png" alt="">
                <a href="#" class="text-2xl font-semibold">GitHub Issues Tracker</a>
            </div>

            <div class="join">
                <div>
                    <label class="input validator join-item">
                        <input id="search-input" type="text" placeholder="Search here" />
                    </label>
                </div>
                <button id="search-btn" class="btn btn-primary join-item">Search</button>
            </div>
        </div>
    </nav>
</body>

</html>
