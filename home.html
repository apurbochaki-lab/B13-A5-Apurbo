<body class="bg-[#F8FAFC]">
    <nav class="bg-base-100 shadow-md sticky top-0 z-10">
        <div class="navbar flex justify-between items-center container mx-auto">
            <div class="flex items-center gap-2">
                <img class="w-10" src="./assets/github-logo.png" alt="">
                <a href="./home.html" class="text-2xl font-semibold">GitHub Issues Tracker</a>
            </div>

            <div class="join">
                <div>
                    <label class="input validator join-item">
                        <input id="search-input" type="text" placeholder="Search here" />
                    </label>
                </div>
                <button onclick="searchMe()" id="search-btn" class="btn btn-primary join-item">Search</button>
            </div>
        </div>
    </nav>

    <header class="shadow-md rounded-md bg-white mt-10 p-6 container mx-auto">
        <!-- name of each tab group should be unique -->
        <button onclick="tabActiveEffect('all-tab-btn')" id="all-tab-btn"
            class="btn px-8 bg-primary text-white">All</button>
        <button onclick="tabActiveEffect('open-tab-btn')" id="open-tab-btn" class="btn px-8">Open</button>
        <button onclick="tabActiveEffect('closed-tab-btn')" id="closed-tab-btn" class="btn px-8">Closed</button>
    </header>

    <main class="mt-8 container mx-auto">
        <section class="bg-white shadow-md p-6 rounded-md flex justify-between items-center">

            <div class="left-div flex items-center gap-3">
                <div class="bg-[#ECE4FF] p-2 rounded-full">
                    <img src="./assets/Aperture.png" alt="">
                </div>
                <div>
                    <h2 class="text-xl font-bold"><span id="total-count">0</span> Issues</h2>
                    <p class="text-[#64748B]">Track and manage your project issues</p>
                </div>
            </div>

            <div class="right-div flex items-center gap-4">
                <div class="flex items-center gap-2">
                    <div class="bg-green-500 h-3 w-3 rounded-full"></div>
                    <p class="font-medium">Open</p>
                </div>

                <div class="flex items-center gap-2">
                    <div class="bg-purple-500 h-3 w-3 rounded-full"></div>
                    <p class="font-medium">Closed</p>
                </div>
            </div>
        </section>
