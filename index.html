    <section class="min-h-screen flex items-center justify-center bg-base-200 p-6">

        <div class="max-w-md w-full bg-white shadow-xl rounded-xl p-8">

            <!-- Header -->
            <div class="text-center space-y-4">
                <img class="mx-auto" src="./assets/github-logo.png" alt="github logo">

                <div>
                    <h2 class="text-xl font-bold">GitHub Issues Tracker</h2>
                    <p class="text-gray-500 text-sm">Sign in to manage your issues</p>
                </div>
            </div>

            <!-- Form -->
            <div class="mt-8 space-y-4">

                <div>
                    <label class="label">
                        <span class="label-text text-black font-medium">Username</span>
                    </label>
                    <input id="input-user" value="admin" type="email" placeholder="Enter Username" class="input input-bordered w-full">
                </div>

                <div>
                    <label class="label">
                        <span class="label-text text-black font-medium">Password</span>
                    </label>
                    <input id="input-pass" value="admin123" type="password" placeholder="Enter Password" class="input input-bordered w-full">
                </div>

                <button id="signIn-btn" class="btn btn-primary w-full mt-2">Sign In</button>

            </div>

            <!-- Bottom Content -->
            <div class="divider">OR</div>
            <p class="text-[#64748B] text-center text-[14px] mb-3">Demo Credentials:</p>
            <div class="text-center bg-base-200 p-5 rounded-md">
                <h4><span class="font-bold">Username:</span> admin</h4>
                <h4><span class="font-bold">Password:</span> admin123</h4>
            </div>
        </div>

    </section>


    <script src="./scripts/login.js"></script>
</body>
